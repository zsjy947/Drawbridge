[project]
name = "drawbridge"
version = "0.1.0"
description = "Drawbridge — MCP bridge for server operations and deployment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Drawbridge maintainers" }]
dependencies = [
    "mcp>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0.1",
    "regex>=2024.5.10",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "uvicorn>=0.30",
]

[project.scripts]
drawbridge-gateway = "drawbridge.entries.gateway_main:main"
drawbridge-runner = "drawbridge.entries.runner_main:main"
drawbridge-selfcheck = "drawbridge.entries.selfcheck_main:main"
drawbridge-simulate = "drawbridge.entries.simulate_main:main"
drawbridge-init-config = "drawbridge.entries.initconfig_main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:drawbridge.*",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle/pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "S",                  # bandit-lite
    "C4", "SIM", "RUF",
]
ignore = [
    "S101",  # assert in tests / internal invariants
    "S603",  # subprocess with fixed argv is the core design here
    "S607",  # partial-path executable lookups only in tests
    "UP040", # TypeAlias / new syntax judgement
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "SIM102", "RUF012", "RUF043"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["drawbridge"]
mypy_path = "src"
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["aiosqlite", "yaml", "regex"]
ignore_missing_imports = true
