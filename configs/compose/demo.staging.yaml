# Compose template — ADMIN-side configuration, lives in
# /etc/drawbridge/compose/demo.staging.yaml on the server, never inside the
# business repository.  Drawbridge rewrites only the image reference to the
# frozen immutable image ID of the release; ports/networks/resources are fixed.
#
# The image token (see below) must appear EXACTLY ONCE in this file — the
# renderer counts raw-text occurrences, comments included.  Multiple services
# sharing one image must use a YAML anchor instead of repeating the token
# (plan D13 / N8⑥):
#   x-image: &img <put the single token here>
#   services:
#     api:  {image: *img}
#     worker: {image: *img}
services:
  api:
    image: REPLACE_BY_DRAWBRIDGE   # replaced with the release's image ID
    ports:
      - "18080:8080"               # host health port matches apps.yaml
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    pids_limit: 128
    restart: unless-stopped
